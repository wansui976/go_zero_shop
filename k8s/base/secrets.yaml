apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: go-zero-shop
type: Opaque
stringData:
  # MySQL
  MYSQL_ROOT_PASSWORD: "root123456"
  MYSQL_USER: "shop"
  MYSQL_PASSWORD: "shop123456"
  
  # Redis
  REDIS_PASSWORD: "redis123456"
  
  # RabbitMQ
  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "admin123456"
  
  # JWT Secret（向后兼容旧 key）
  JWT_SECRET: "your-jwt-secret-key-here-change-in-production"

  # 应用层敏感配置（由 pkg/envcfg 在启动时读取，覆盖 ConfigMap/yaml 中的明文）
  USER_JWT_SALT: "CHANGE_ME_USER_JWT_SALT"
  ES_PASSWORD: "CHANGE_ME_ES_PASSWORD"
  PAY_WEBHOOK_SECRET: "CHANGE_ME_PAY_WEBHOOK_SECRET"
